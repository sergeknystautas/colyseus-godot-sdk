name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false

      - name: Install GdUnit4
        run: |
          GDUNIT4_VERSION="v4.4.1"
          mkdir -p addons/gdUnit4
          curl -sL "https://github.com/MikeSchulze/gdUnit4/archive/refs/tags/${GDUNIT4_VERSION}.tar.gz" | \
            tar xz --strip-components=2 -C addons/gdUnit4 "gdUnit4-${GDUNIT4_VERSION#v}/addons/gdUnit4"

      - name: Import project
        run: godot --headless --import 2>/dev/null || true

      - name: Run unit tests
        run: just test-unit
